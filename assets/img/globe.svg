    .globe__grid{fill:none;stroke:#9cc8ff;stroke-opacity:.32;stroke-width:1}
    .globe__arc{fill:none;stroke:#ffffff;stroke-opacity:.75;stroke-width:1.4;stroke-dasharray:4 5;animation:dash 2.4s linear infinite}
    .globe__dot{fill:#ffffff;filter:drop-shadow(0 0 4px #7fb4ff)}
